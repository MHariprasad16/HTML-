<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="" method="">
        
        <fieldset>
        <legend align="center">Login Form✌️</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name😊" minlength="10" maxlength="20" required autofocus  readonly value="Hariprasad" >
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email 📧" value="hariprasad@gmail.com" disabled >
        <br><br>


        <label for="password">Password:</label>
        <input type="password" id="password">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" min="18" max="50">
        <br><br>
        
        <label for="Phoneno">PhoneNo:</label>
        <input type="tel" id="Phoneno">
        <br><br>

        <label for="Dob">DOD:</label>
        <input type="date" >
        <input type="datetime-local">
        <input type="month">
        <input type="week" >
        <input type="time">
        <br><br>

        <label >Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male </label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female </label>
        <br> <br>

        <label>skills:-</label>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">  
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills"  value="js">
        <label for="js">JS</label>
        <br><br>

        <label for="photo">Upload photo:</label>
        <input type="file" id="photo"  multiple>
        <br><br>


        <label for="country">country:</label>
        <select id="country"> 
            <option disabled selected>--selected country</option>
            <option>India</option>
            <option>Russia</option>
            <option>USA</option>
            <option>Germany</option>
            </select>
        <br><br>

        <label for="feedback">Feedback:</label>
        <textarea id="feedback" rows="10" cols="100"></textarea>
        <br><br>

        <label for="color">Choose color:</label>
        <input type="color" id="color">
        <br><br>



        <label for="brightness">Brightness:</label>
        <input type="range" id="brightness">
        <br><br>


        <input type="reset" value="Clear">
        <input type="submit" value="Login😊">
        </fieldset>
    </form>
</body>
</html>
